name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Derive release version
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist

  github-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" dist/* --draft --title "${{ needs.build.outputs.tag }}" --notes-file .github/release-template.md

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: [build, github-release]
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/webots-mcp-kit/
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/

  test-install-testpypi:
    runs-on: windows-latest
    needs: [build, publish-testpypi]
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Webots
        shell: powershell
        run: |
          $url = 'https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a_setup.exe'
          $installer = Join-Path $env:TEMP 'webots-R2025a_setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          "WEBOTS_HOME=C:\Program Files\Webots" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install from TestPyPI
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          for ($i = 0; $i -lt 10; $i++) {
            try {
              python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "webots-mcp-kit==$env:PACKAGE_VERSION"
              exit 0
            } catch {
              if ($i -eq 9) { throw }
              Start-Sleep -Seconds 15
            }
          }

      - name: Install smoke
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\verify_install.ps1 -Runtime

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build, test-install-testpypi]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/webots-mcp-kit/
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  test-install-pypi:
    runs-on: windows-latest
    needs: [build, publish-pypi]
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Webots
        shell: powershell
        run: |
          $url = 'https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a_setup.exe'
          $installer = Join-Path $env:TEMP 'webots-R2025a_setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          "WEBOTS_HOME=C:\Program Files\Webots" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install from PyPI
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          for ($i = 0; $i -lt 10; $i++) {
            try {
              python -m pip install "webots-mcp-kit==$env:PACKAGE_VERSION"
              exit 0
            } catch {
              if ($i -eq 9) { throw }
              Start-Sleep -Seconds 15
            }
          }

      - name: Install smoke
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\verify_install.ps1 -Runtime
