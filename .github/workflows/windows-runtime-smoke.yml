name: Windows Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-runtime-smoke.yml"
      - "src/webots_mcp_kit/daemon.py"
      - "src/webots_mcp_kit/launcher.py"
      - "src/webots_mcp_kit/controller_authoring.py"
      - "src/webots_mcp_kit/runtime/**"
      - "src/webots_mcp_kit/examples/**"
      - "src/webots_mcp_kit/benchmarks.py"
      - "src/webots_mcp_kit/scenario_ops.py"
      - "src/webots_mcp_kit/world_document.py"
      - "src/webots_mcp_kit/world_ops.py"
      - "tests/test_smoke_cli.py"
      - "examples/getting-started/**"
  pull_request:
    paths:
      - ".github/workflows/windows-runtime-smoke.yml"
      - "src/webots_mcp_kit/daemon.py"
      - "src/webots_mcp_kit/launcher.py"
      - "src/webots_mcp_kit/controller_authoring.py"
      - "src/webots_mcp_kit/runtime/**"
      - "src/webots_mcp_kit/examples/**"
      - "src/webots_mcp_kit/benchmarks.py"
      - "src/webots_mcp_kit/scenario_ops.py"
      - "src/webots_mcp_kit/world_document.py"
      - "src/webots_mcp_kit/world_ops.py"
      - "tests/test_smoke_cli.py"
      - "examples/getting-started/**"
  workflow_dispatch:

jobs:
  runtime-smoke:
    runs-on: [self-hosted, windows, interactive-webots]
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    env:
      WEBOTS_KIT_SESSION_START_TIMEOUT: "180"
      WEBOTS_KIT_RUN_RUNTIME_SMOKE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve runner Python
        id: python
        run: |
          $candidateRoots = [System.Collections.Generic.List[string]]::new()
          $installerCandidates = [System.Collections.Generic.List[string]]::new()
          [void]$candidateRoots.Add('D:\actions-runner\python311-shared')
          $registryKeys = @(
            'HKCU:\SOFTWARE\Python\PythonCore\3.11\InstallPath',
            'HKLM:\SOFTWARE\Python\PythonCore\3.11\InstallPath',
            'HKCU:\SOFTWARE\WOW6432Node\Python\PythonCore\3.11\InstallPath',
            'HKLM:\SOFTWARE\WOW6432Node\Python\PythonCore\3.11\InstallPath'
          )
          foreach ($registryKey in $registryKeys) {
            if (-not (Test-Path $registryKey)) {
              continue
            }
            $registryItem = Get-Item -Path $registryKey
            $installRoot = $registryItem.GetValue('')
            if (-not [string]::IsNullOrWhiteSpace($installRoot)) {
              [void]$candidateRoots.Add($installRoot)
              $installerCandidate = Join-Path $installRoot 'python-3.11.9-amd64.exe'
              if (Test-Path $installerCandidate) {
                [void]$installerCandidates.Add($installerCandidate)
              }
            }
          }
          foreach ($userDir in Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue) {
            [void]$candidateRoots.Add((Join-Path $userDir.FullName 'AppData\Local\Programs\Python\Python311'))
          }
          [void]$candidateRoots.Add('C:\Program Files\Python311')
          [void]$candidateRoots.Add('C:\Python311')

          $pythonExe = $null
          foreach ($installRoot in $candidateRoots) {
            $candidate = Join-Path $installRoot 'python.exe'
            $encodings = Join-Path $installRoot 'Lib\encodings\__init__.py'
            try {
              $hasCandidate = Test-Path -LiteralPath $candidate -ErrorAction Stop
              $hasEncodings = Test-Path -LiteralPath $encodings -ErrorAction Stop
            } catch {
              continue
            }
            if ($hasCandidate -and $hasEncodings) {
              $pythonExe = $candidate
              break
            }
          }

          if (-not $pythonExe) {
            $bootstrapRoot = Join-Path $env:RUNNER_TEMP 'python311-bootstrap'
            $bootstrapPython = Join-Path $bootstrapRoot 'python.exe'
            $bootstrapEncodings = Join-Path $bootstrapRoot 'Lib\encodings\__init__.py'
            if (-not ((Test-Path -LiteralPath $bootstrapPython -ErrorAction SilentlyContinue) -and (Test-Path -LiteralPath $bootstrapEncodings -ErrorAction SilentlyContinue))) {
              $installer = $installerCandidates | Select-Object -First 1
              if (-not $installer) {
                throw 'Could not resolve a valid Python 3.11 installation and no local Python 3.11 installer candidate was found.'
              }
              if (Test-Path -LiteralPath $bootstrapRoot) {
                Remove-Item -LiteralPath $bootstrapRoot -Recurse -Force
              }
              New-Item -ItemType Directory -Path $bootstrapRoot -Force | Out-Null
              $arguments = @(
                '/quiet',
                "TargetDir=$bootstrapRoot",
                'InstallAllUsers=0',
                'PrependPath=0',
                'Include_pip=1',
                'Include_launcher=0',
                'AssociateFiles=0',
                'Shortcuts=0',
                'CompileAll=0',
                'SimpleInstall=1'
              )
              $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                throw "Python bootstrap installer failed with exit code $($process.ExitCode)."
              }
            }
            if ((Test-Path -LiteralPath $bootstrapPython -ErrorAction SilentlyContinue) -and (Test-Path -LiteralPath $bootstrapEncodings -ErrorAction SilentlyContinue)) {
              $pythonExe = $bootstrapPython
            }
          }

          if (-not $pythonExe) {
            throw 'Could not resolve a valid Python 3.11 installation with a standard library.'
          }
          "python_exe=$pythonExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify runner Python
        run: |
          & "${{ steps.python.outputs.python_exe }}" --version
          & "${{ steps.python.outputs.python_exe }}" -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Install toolkit
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m ensurepip --upgrade
          & "${{ steps.python.outputs.python_exe }}" -m pip install --upgrade pip
          & "${{ steps.python.outputs.python_exe }}" -m pip install -e .[dev]
          & "${{ steps.python.outputs.python_exe }}" -m pip show pytest
          & "${{ steps.python.outputs.python_exe }}" -c "import webots_mcp_kit, pytest; print(webots_mcp_kit.__version__)"

      - name: Doctor
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m webots_mcp_kit.cli doctor --json

      - name: Session runtime smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k session_start_inspect_stop_smoke

      - name: Benchmark runtime smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k benchmark_smoke

      - name: Generated scenario runtime smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k generated_scenario_smoke

      - name: Generated world authoring runtime smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k generated_world_edit_smoke

      - name: Imported project runtime smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k imported_project_smoke

      - name: Imported world authoring runtime smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k imported_world_edit_smoke

      - name: MCP authoring contract smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k mcp_authoring_contract_smoke

      - name: MCP contract runtime smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k mcp_contract_smoke

      - name: MCP authoring contract smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k mcp_authoring_contract_smoke

      - name: Export replay diagnostics runtime smoke
        run: |
          & "${{ steps.python.outputs.python_exe }}" -m pytest -q -k session_export_replay_diagnostics_smoke

      - name: Upload failure diagnostics
        if: failure()
        run: |
          $diag = Join-Path $env:GITHUB_WORKSPACE '.ci-diagnostics'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $pythonExe = "${{ steps.python.outputs.python_exe }}"
          if ([string]::IsNullOrWhiteSpace($pythonExe)) {
            Set-Content -LiteralPath (Join-Path $diag 'python-resolution.txt') -Value 'python_exe output was empty; Python resolution failed before diagnostics could run.'
          } else {
            & $pythonExe -m webots_mcp_kit.diagnostics --output $diag
          }
          $sessionRoot = Join-Path $env:LOCALAPPDATA 'webots-mcp-kit\sessions'
          if (Test-Path $sessionRoot) {
            Copy-Item -LiteralPath $sessionRoot -Destination (Join-Path $diag 'sessions') -Recurse -Force
          }

      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-smoke-diagnostics
          path: ${{ github.workspace }}\.ci-diagnostics
