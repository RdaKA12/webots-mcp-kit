name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    env:
      WEBOTS_KIT_SESSION_START_TIMEOUT: "180"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Pin smoke Python
        shell: powershell
        run: |
          $pythonExe = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $pythonExe)) {
            throw "setup-python python.exe not found at $pythonExe"
          }
          "WEBOTS_KIT_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Webots
        shell: powershell
        run: |
          $url = 'https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a_setup.exe'
          $installer = Join-Path $env:TEMP 'webots-R2025a_setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          "WEBOTS_HOME=C:\Program Files\Webots" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install toolkit
        shell: powershell
        run: |
          & $env:WEBOTS_KIT_PYTHON -m ensurepip --upgrade
          & $env:WEBOTS_KIT_PYTHON -m pip install --upgrade pip
          & $env:WEBOTS_KIT_PYTHON -m pip install -e .[dev]
          & $env:WEBOTS_KIT_PYTHON -m pip show pytest
          & $env:WEBOTS_KIT_PYTHON -c "import webots_mcp_kit, pytest; print(webots_mcp_kit.__version__)"

      - name: Verify Webots install
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\Program Files\Webots\resources\version.txt')) { throw 'Webots version file not found after install.' }
          Get-Content 'C:\Program Files\Webots\resources\version.txt'
          & 'C:\Program Files\Webots\msys64\mingw64\bin\webots.exe' --version

      - name: Unit tests
        shell: powershell
        run: |
          & $env:WEBOTS_KIT_PYTHON -m pytest -q -k "not smoke"

      - name: Doctor smoke
        shell: powershell
        run: |
          & $env:WEBOTS_KIT_PYTHON -m webots_mcp_kit.cli doctor --json

      - name: Public verify JSON smoke
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\verify_install.ps1 -Json -Output .\verify-install.json
          Get-Content .\verify-install.json

      - name: MonsterBorg verify JSON smoke
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\verify_install.ps1 -RobotProfile monsterborg-4wd -Json -Output .\verify-install-monsterborg.json
          Get-Content .\verify-install-monsterborg.json

      - name: Team upgrade smoke
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\upgrade_check.ps1 -Workspace .\upgrade-check -Runtime -Output .\upgrade-check.json
          Get-Content .\upgrade-check.json

      - name: MonsterBorg team upgrade smoke
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\upgrade_check.ps1 -Workspace .\monsterborg-upgrade-check -RobotProfile monsterborg-4wd -Runtime -Output .\monsterborg-upgrade-check.json
          Get-Content .\monsterborg-upgrade-check.json

      - name: MCP smoke
        shell: powershell
        env:
          WEBOTS_KIT_RUN_SMOKE: "1"
        run: |
          @'
          import asyncio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(command='python', args=['-m', 'webots_mcp_kit.cli', 'mcp', 'serve'])
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      print([tool.name for tool in tools.tools])

          asyncio.run(main())
          '@ | & $env:WEBOTS_KIT_PYTHON -

      - name: Upload failure diagnostics
        if: failure()
        shell: powershell
        run: |
          $diag = Join-Path $env:GITHUB_WORKSPACE '.ci-diagnostics'
          & $env:WEBOTS_KIT_PYTHON -m webots_mcp_kit.diagnostics --output $diag
          $sessionRoot = Join-Path $env:LOCALAPPDATA 'webots-mcp-kit\sessions'
          if (Test-Path $sessionRoot) {
            Copy-Item -LiteralPath $sessionRoot -Destination (Join-Path $diag 'sessions') -Recurse -Force
          }

      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-diagnostics
          path: ${{ github.workspace }}\.ci-diagnostics
