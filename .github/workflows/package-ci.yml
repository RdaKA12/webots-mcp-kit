name: Packaging CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest mcp tree-sitter tree-sitter-cpp

      - name: User adoption static checks
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_version_consistency.py tests/test_workflow_install_consistency.py tests/test_user_adoption.py

      - name: Build distributions
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Package smoke
        run: |
          python scripts/clean_user_acceptance.py --workspace package-smoke --profile hosted-safe

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaging-dist
          path: dist
