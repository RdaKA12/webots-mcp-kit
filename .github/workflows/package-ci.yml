name: Packaging CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Package smoke
        run: |
          webots-kit benchmark list
          webots-kit project init package-smoke
          webots-kit scenario init package-smoke/scenarios/demo-waypoint --template epuck-waypoint
          webots-kit scenario build package-smoke/scenarios/demo-waypoint/webots-kit.scenario.json

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaging-dist
          path: dist
