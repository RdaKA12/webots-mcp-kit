[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webots-mcp-kit"
version = "0.4.2"
description = "Local-first Webots MCP toolkit with session launcher, agent SDK, and line follower benchmark."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Arda Karakas" }
]
dependencies = [
  "mcp>=1.12.4,<2",
]

[project.urls]
Homepage = "https://github.com/RdaKA12/webots-mcp-kit"
Issues = "https://github.com/RdaKA12/webots-mcp-kit/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
webots-kit = "webots_mcp_kit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
